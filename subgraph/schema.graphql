"""
CRM Command Center – The Graph Schema
All on-chain CRM entities indexed for fast GraphQL querying.
"""

type Organization @entity {
  id:         Bytes!   # orgId (bytes32)
  owner:      Bytes!   # wallet address
  name:       String!
  createdAt:  BigInt!
  active:     Boolean!
  members:    [OrgMember!]! @derivedFrom(field: "org")
  contacts:   [Contact!]!   @derivedFrom(field: "org")
  deals:      [Deal!]!      @derivedFrom(field: "org")
  activities: [ActivityEntry!]! @derivedFrom(field: "org")
  invoices:   [Invoice!]!   @derivedFrom(field: "org")
}

type OrgMember @entity {
  id:    ID!      # orgId-walletAddress
  org:   Organization!
  wallet: Bytes!
  role:   Int!    # 1=Admin, 2=SalesRep, 3=ReadOnly
  addedAt: BigInt!
  active:  Boolean!
}

type Contact @entity {
  id:           Bytes!   # contactId (bytes32)
  org:          Organization!
  dataHash:     Bytes!
  registeredBy: Bytes!
  createdAt:    BigInt!
  updatedAt:    BigInt!
  active:       Boolean!
  didUri:       String
  consentGranted: Boolean!
  deals:        [Deal!]! @derivedFrom(field: "contact")
  activities:   [ActivityEntry!]! @derivedFrom(field: "contact")
}

type Deal @entity {
  id:          Bytes!   # dealId (bytes32)
  org:         Organization!
  contact:     Contact
  dataHash:    Bytes!
  assignedTo:  Bytes!
  createdBy:   Bytes!
  valueWei:    BigInt!
  createdAt:   BigInt!
  updatedAt:   BigInt!
  stage:       Int!     # 0=Lead,1=Qualified,2=Proposal,3=Negotiation,4=ClosedWon,5=ClosedLost
  active:      Boolean!
  stageHistory: [DealStageChange!]! @derivedFrom(field: "deal")
  activities:  [ActivityEntry!]! @derivedFrom(field: "deal")
}

type DealStageChange @entity {
  id:         ID!
  deal:       Deal!
  fromStage:  Int!
  toStage:    Int!
  actor:      Bytes!
  notesHash:  Bytes!
  timestamp:  BigInt!
}

type ActivityEntry @entity {
  id:           ID!       # global log index
  index:        BigInt!
  org:          Organization!
  contact:      Contact
  deal:         Deal
  payloadHash:  Bytes!
  activityType: Int!      # 0=Call,1=Email,2=Meeting,3=Note,4=ApiUsage,5=DealUpdate,6=Custom
  actor:        Bytes!
  timestamp:    BigInt!
}

type Invoice @entity {
  id:             ID!    # tokenId as string
  tokenId:        BigInt!
  org:            Organization!
  paidBy:         Bytes!
  amountWei:      BigInt!
  creditsGranted: BigInt!
  periodStart:    BigInt!
  periodEnd:      BigInt!
  issuedAt:       BigInt!
  metadataHash:   Bytes!
  settled:        Boolean!
}

# Analytics aggregates (updated on each event)
type OrgStats @entity {
  id:                  ID!    # orgId
  org:                 Organization!
  totalContacts:       BigInt!
  totalDeals:          BigInt!
  openDeals:           BigInt!
  closedWonDeals:      BigInt!
  closedLostDeals:     BigInt!
  totalActivities:     BigInt!
  totalInvoiceAmount:  BigInt!
  lastUpdated:         BigInt!
}
