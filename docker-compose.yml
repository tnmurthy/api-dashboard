version: "3.9"

services:
  # ── Local Hardhat blockchain node ───────────────────────────────────────────
  hardhat:
    image: node:20-alpine
    working_dir: /app/contracts
    volumes:
      - .:/app
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8545', r => process.exit(r.statusCode === 200 || r.statusCode === 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Deploy contracts after node is up ───────────────────────────────────────
  deploy:
    image: node:20-alpine
    working_dir: /app/contracts
    volumes:
      - .:/app
    command: sh -c "npm install && npx hardhat run scripts/deploy.js --network localhost"
    depends_on:
      hardhat:
        condition: service_healthy
    environment:
      BLOCKCHAIN_RPC_URL: "http://hardhat:8545"

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    image: node:20-alpine
    working_dir: /app/backend
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_ORIGIN: "http://localhost:3000"
      BLOCKCHAIN_RPC_URL: "http://hardhat:8545"
      CHAIN_ID: "31337"
      # Set the remaining env vars via .env or docker-compose.override.yml
    depends_on:
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => process.exit(JSON.parse(d).status === 'ok' ? 0 : 1)); }).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Frontend (served statically via a simple HTTP server) ───────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: npx serve . -l 3000 --no-clipboard
    ports:
      - "3000:3000"
    depends_on:
      - backend
